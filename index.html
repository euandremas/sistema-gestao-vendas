<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Gestão de Vendas</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <header>
        <div class="container">
            <h1>Sistema de Gestão de Vendas</h1>

            <p>
                Gerencie produtos, calcule descontos e consulte endereços por CEP.
            </p>
        </div>
    </header>

    <main class="container">

        <section id="catalogo">

            <h2>Catálogo de Produtos</h2>

            <div id="listaProdutos">

            </div>

        </section>

        <section id="desconto">

            <h2>Calculadora de Desconto</h2>

            <form id="formDesconto">

                <label for="precoProduto">
                    Preço do Produto
                </label>

                <input
                    type="number"
                    id="precoProduto"
                    placeholder="Ex.: 2500"
                >

                <label for="percentualDesconto">
                    Desconto (%)
                </label>

                <input
                    type="number"
                    id="percentualDesconto"
                    placeholder="Ex.: 10"
                >

                <button type="submit">
                    Calcular
                </button>

            </form>

            <div id="resultadoDesconto">

            </div>

        </section>

        <section id="cep">

            <h2>Consulta de CEP</h2>

            <form id="formCep">

                <label for="cepBusca">
                    CEP
                </label>

                <input
                    type="text"
                    id="cepBusca"
                    placeholder="00000-000"
                >

                <button type="submit">
                    Buscar CEP
                </button>

            </form>

            <div id="resultadoCep">

            </div>

        </section>

    </main>

    <footer>

        <p>
            Projeto desenvolvido para a disciplina Back-end Development.
        </p>

    </footer>

    <script src="./js/produtos.js"></script>
    <script src="./js/desconto.js"></script>
    <script src="./js/cep.js"></script>
    <script src="./js/app.js"></script>

</body>
</html>
